name: Run benchmarks

# Compare the benchmarks of `benchmark/benchmarks.jl` (taken from the pull request) between
# the default branch and the pull request, on a GitHub-hosted runner, and post the ratios
# as a comment. The absolute times of these shared machines are noisy, but both revisions
# run in the same job, so their ratios are meaningful.
on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Benchmark:
    runs-on: ubuntu-latest
    # only for pull requests labeled `run benchmark`, from branches of this repository
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run benchmark') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: "1"
          bench-on: ${{ github.event.pull_request.head.sha }}
          exeflags: "--threads=4"
